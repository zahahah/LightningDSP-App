name: Verify global mixer experiment

on:
  push:
    branches: [global-output-experiment]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mixer-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'zahahah/LightningDSP-App' && github.ref == 'refs/heads/global-output-experiment'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Test and compile all supported adapters, then assemble root release
        run: >-
          ./gradlew --no-daemon --max-workers=2
          testRootFullReleaseUnitTest compileRootlessFullReleaseKotlin
          compilePluginFullReleaseKotlin assembleRootFullRelease
      - name: Upload test reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixer-app-verification-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/reports/tests/testRootFullReleaseUnitTest/
            app/build/test-results/testRootFullReleaseUnitTest/
      # Signing happens locally with the authorized key. The companion module
      # workflow verifies and uploads the identical signed standalone/embedded
      # APK. Never distribute this job's unsigned APK as the installable build.
